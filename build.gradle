plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish.base' version '0.37.0'
}

group = 'com.spinyowl'

import java.text.SimpleDateFormat

printProjectInfo()

private void printProjectInfo() {
    println "##################################################"
    println "# Project info:                                  #"
    println sprintf("#     group:    %-33s#", project.group)
    println sprintf("#     name:     %-33s#", project.name)
    println sprintf("#     version:  %-33s#", project.version)
    println "##################################################"
}


configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor(0, 'seconds')
}

apply plugin: 'idea'
apply plugin: 'eclipse'

idea { module { downloadJavadoc = true; downloadSources = true } }

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"
javadoc.options.encoding = 'UTF-8'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
    modularity.inferModulePath = true
}

repositories {
    mavenCentral()
}

dependencies {
    api("org.lwjgl:lwjgl:${lwjgl_version}") { changing = true }
    api("org.lwjgl:lwjgl:${lwjgl_version}:natives-windows") { changing = true }
    api("org.lwjgl:lwjgl:${lwjgl_version}:natives-linux") { changing = true }
    api("org.lwjgl:lwjgl:${lwjgl_version}:natives-macos") { changing = true }

    api("org.lwjgl:lwjgl-glfw:${lwjgl_version}") { changing = true }
    api("org.lwjgl:lwjgl-glfw:${lwjgl_version}:natives-windows") { changing = true }
    api("org.lwjgl:lwjgl-glfw:${lwjgl_version}:natives-linux") { changing = true }
    api("org.lwjgl:lwjgl-glfw:${lwjgl_version}:natives-macos") { changing = true }
}

// PUBLISH SECTION
def buildRevision = providers.exec {
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.map { it.trim() }

jar {
    manifest.attributes(
            'Build-Timestamp': new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date()),
            'Build-Revision': buildRevision,
            'Created-By': "Gradle ${gradle.gradleVersion}",
            'Build-Jdk': "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
            'Build-OS': "${System.properties['os.name']} ${System.properties['os.arch']} ${System.properties['os.version']}",
            'Full-Version': project.version
    )
}

publishing {
    repositories {
        maven {
            name = 'localArtifacts'
            url = layout.buildDirectory.dir('publish')
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'CBCHAIN'
                description = 'Composable GLFW callback chains for LWJGL 3.'
                url = 'https://github.com/SpinyOwl/cbchain'
                inceptionYear = '2019'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit/'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'SpinyOwl'
                        name = 'Spiny Owl'
                        url = 'https://github.com/SpinyOwl'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/SpinyOwl/cbchain.git'
                    developerConnection = 'scm:git:ssh://git@github.com/SpinyOwl/cbchain.git'
                    url = 'https://github.com/SpinyOwl/cbchain'
                }
            }
        }
    }
}

// Explicit release commands enable Central publishing and mandatory GPG signing.
if (providers.gradleProperty('centralPublishing').map { it.toBoolean() }.getOrElse(false)) {
    mavenPublishing {
        publishToMavenCentral(false)
        signAllPublications()
    }
}
